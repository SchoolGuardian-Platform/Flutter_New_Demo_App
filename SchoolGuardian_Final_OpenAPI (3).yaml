  /reports/student/{studentId}/academic:
    get:
      tags: [Reports]
      summary: Get academic report
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200': { description: Academic report }

  /reports/student/{studentId}/attendance:
