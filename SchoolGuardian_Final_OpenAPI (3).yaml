openapi: 3.1.0

info:
  title: SchoolGuardian API
  version: 1.0.0
  description: |
    SchoolGuardian API for parent, student, teacher, and administrator
    education and child-safety management.

    Implemented: authentication, registration approvals, and
    parent-student relationship verification.

    Planned contracts: attendance, grades, homework, notes, notifications,
    location, geofencing, digital wellbeing, and reports.

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

tags:
  - name: Authentication
  - name: Student Approval
  - name: Teacher Approval
  - name: Parent Approval
  - name: Relationships
  - name: Attendance
  - name: Grades
  - name: Homework
  - name: Teacher Notes
  - name: Notifications
  - name: Location
  - name: Geofences
  - name: Digital Wellbeing
  - name: Reports
  - name: Parent-Teacher Chat
  - name: Appointments

security:
  - bearerAuth: []

paths:

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new Parent/Guardian and link or create a student
      description: |
        Endpoint for the final registration form. 
        Step 1 handles parent info.
        Step 2 chooses NEW_STUDENT or EXISTING_STUDENT.
        Step 3A/3B provides corresponding student information.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentRegistrationRequest'
      responses:
        '201':
          description: Registration successful, returns user and auth tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: Too many registration attempts }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Too many login attempts }

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204': { description: Logout successful }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/students/pending:
    get:
      tags: [Student Approval]
      summary: Get pending student registrations
      x-implementation-status: implemented
      responses:
        '200':
          description: Pending students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/students/{id}:
    get:
      tags: [Student Approval]
      summary: Get student by ID
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/students/{id}/approve:
    patch:
      tags: [Student Approval]
      summary: Approve student registration
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Student approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/students/{id}/reject:
    patch:
      tags: [Student Approval]
      summary: Reject student registration
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectionRequest'
      responses:
        '200':
          description: Student rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/teachers/pending:
