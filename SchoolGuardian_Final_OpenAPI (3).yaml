  /wellbeing/usage:
    post:
      tags: [Digital Wellbeing]
      summary: Upload device/app usage (STUDENT only)
      description: |
        The Flutter app uploads the student's permitted usage data.
        The backend identifies the student from the JWT, enforcing that students
        can only upload their own data.
        Duplicate daily records are resolved via upsert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellbeingUsageRequest'
      responses:
        '200':
          description: Usage successfully recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellbeingResponse'

  /wellbeing/me:
    get:
      tags: [Digital Wellbeing]
      summary: Get own wellbeing data (STUDENT only)
      responses:
        '200':
          description: Returns the authenticated student's wellbeing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellbeingResponse'

  /students/{studentId}/wellbeing/daily:
    get:
      tags: [Digital Wellbeing]
      summary: Get student daily wellbeing summary
      description: Accessible by Admin, the student themselves, or an approved Parent.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Wellbeing summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellbeingResponse'

  /students/{studentId}/wellbeing/weekly:
    get:
      tags: [Digital Wellbeing]
      summary: Get student weekly wellbeing summary
      description: Accessible by Admin, the student themselves, or an approved Parent.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Weekly aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellbeingWeeklyResponse'

  /students/{studentId}/wellbeing/limit:
    put:
      tags: [Digital Wellbeing]
      summary: Create or update wellbeing limits (PARENT only)
      description: Only an approved parent can set this limit.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellbeingLimitRequest'
      responses:
        '200':
          description: Limit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellbeingLimitResponse'

    get:
      tags: [Digital Wellbeing]
      summary: Get configured limits
      description: Accessible by Admin, the student, or an approved Parent.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellbeingLimitResponse'

components:

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    ParentRegistrationRequest:
      type: object
      required: [firstName, lastName, email, phoneNumber, password, confirmPassword, studentRegistrationType]
      properties:
        firstName: { type: string }
        middleName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phoneNumber: { type: string }
        password: { type: string, format: password }
        confirmPassword: { type: string, format: password }
        studentRegistrationType:
          type: string
          enum: [NEW_STUDENT, EXISTING_STUDENT]
          description: "Indicates whether adding a new student or linking an existing one"
        newStudentInfo:
          $ref: '#/components/schemas/NewStudentInfo'
        existingStudentInfo:
          $ref: '#/components/schemas/ExistingStudentInfo'

    NewStudentInfo:
      type: object
      required: [firstName, lastName, gender, dateOfBirth, gradeClass, schoolId, relationshipToStudent]
      description: "Information required when registering a New Student"
      properties:
        firstName: { type: string }
        middleName: { type: string }
        lastName: { type: string }
        gender: { type: string }
        dateOfBirth: { type: string, format: date }
        gradeClass: { type: string }
        schoolId: { type: string, description: "The school selected by the parent" }
        relationshipToStudent: { $ref: '#/components/schemas/RelationshipType' }

    ExistingStudentInfo:
      type: object
      required: [studentId, schoolCode, relationshipToStudent]
      description: "Information required when linking to an Existing Student"
      properties:
        studentId: { type: string, description: "Student's unique ID provided by the school" }
        schoolCode: { type: string, description: "School's unique identifier" }
        relationshipToStudent: { $ref: '#/components/schemas/RelationshipType' }

    Role:
      type: string
      enum: [ADMIN, PARENT, STUDENT, TEACHER]

    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED, SUSPENDED]

    RelationshipType:
      type: string
      enum: [MOTHER, FATHER, GUARDIAN, OTHER]

    RelationshipStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT, LATE, EXCUSED]

    LocationEventType:
      type: string
      enum:
        - SCHOOL_ARRIVAL
        - SCHOOL_DEPARTURE
        - HOME_ARRIVAL
        - HOME_DEPARTURE
        - GEOFENCE_ENTRY
        - GEOFENCE_EXIT

    User:
      type: object
      required: [id, name, email, role, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        studentId: { type: string, description: "Generated custom ID for students (e.g. STU-10025)", nullable: true }
        schoolCode: { type: string, description: "Generated school code for students (e.g. ABC-001)", nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/User' }

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: [string, 'null']

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            user: { $ref: '#/components/schemas/User' }

    RejectionRequest:
      type: object
      properties:
        reason:
          type: string

    CreateRelationshipRequest:
      type: object
      required: [studentId, relationshipType]
      properties:
        studentId: { type: string, format: uuid }
        relationshipType: { $ref: '#/components/schemas/RelationshipType' }

    Relationship:
      type: object
      required: [id, parentId, studentId, relationshipType, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        relationshipType: { $ref: '#/components/schemas/RelationshipType' }
        status: { $ref: '#/components/schemas/RelationshipStatus' }
        verifiedBy: { type: [string, 'null'], format: uuid }
        verifiedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RelationshipResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Relationship' }

    RelationshipListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Relationship' }

    AttendanceRequest:
      type: object
      required: [studentId, date, status]
      properties:
        studentId: { type: string, format: uuid }
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        note: { type: string }

    AttendanceUpdateRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        note: { type: string }

    AttendanceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              studentId: { type: string, format: uuid }
              date: { type: string, format: date }
              status: { $ref: '#/components/schemas/AttendanceStatus' }
              note: { type: string }
              createdAt: { type: string, format: date-time }

    AttendanceSummaryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            totalDays: { type: integer }
            present: { type: integer }
            absent: { type: integer }
            late: { type: integer }
            excused: { type: integer }
            attendanceRate: { type: number }

    GradeRequest:
      type: object
      required: [studentId, subject, score]
      properties:
        studentId: { type: string, format: uuid }
        subject: { type: string }
        assessment: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        maxScore: { type: number, minimum: 1, default: 100 }
        comment: { type: string }

    GradeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              studentId: { type: string, format: uuid }
              subject: { type: string }
              assessment: { type: string }
              score: { type: number }
              maxScore: { type: number }
              comment: { type: string }
              createdAt: { type: string, format: date-time }

    GradeSummaryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            averageScore: { type: number }
            totalAssessments: { type: integer }

    HomeworkRequest:
      type: object
      required: [title, description, dueDate]
      properties:
        title: { type: string }
        description: { type: string }
        dueDate: { type: string, format: date-time }
        subject: { type: string }

    HomeworkListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              description: { type: string }
              subject: { type: string }
              dueDate: { type: string, format: date-time }
              createdAt: { type: string, format: date-time }

    NoteRequest:
      type: object
      required: [studentId, content]
      properties:
        studentId: { type: string, format: uuid }
        content: { type: string }

    NoteListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              studentId: { type: string, format: uuid }
              teacherId: { type: string, format: uuid }
              content: { type: string }
              createdAt: { type: string, format: date-time }

    NotificationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              message: { type: string }
              read: { type: boolean }
              createdAt: { type: string, format: date-time }

    LocationCheckInRequest:
      type: object
      required: [studentId, eventType, latitude, longitude]
      properties:
        studentId: { type: string, format: uuid }
        eventType: { $ref: '#/components/schemas/LocationEventType' }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyMeters: { type: number, minimum: 0 }

    LocationHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              studentId: { type: string, format: uuid }
              eventType: { $ref: '#/components/schemas/LocationEventType' }
              latitude: { type: number }
              longitude: { type: number }
              accuracyMeters: { type: number }
              createdAt: { type: string, format: date-time }

    GeofenceRequest:
      type: object
      required: [name, latitude, longitude, radiusMeters]
      properties:
        name: { type: string, example: School }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radiusMeters: { type: number, minimum: 10 }

    GeofenceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              latitude: { type: number }
              longitude: { type: number }
              radiusMeters: { type: number }
              createdAt: { type: string, format: date-time }

    WellbeingUsageRequest:
      type: object
      required: [studentId, date, screenTimeMinutes]
      properties:
        studentId: { type: string, format: uuid }
        date: { type: string, format: date }
        screenTimeMinutes: { type: integer, minimum: 0 }
        studyMinutes: { type: integer, minimum: 0 }
        gamingMinutes: { type: integer, minimum: 0 }
        socialMediaMinutes: { type: integer, minimum: 0 }
        educationalMinutes: { type: integer, minimum: 0 }
        mostUsedApp: { type: string }

    WellbeingResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            screenTimeMinutes: { type: integer }
            studyMinutes: { type: integer }
            gamingMinutes: { type: integer }
            socialMediaMinutes: { type: integer }
            educationalMinutes: { type: integer }
            mostUsedApp: { type: string }

    WellbeingWeeklyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            totalScreenTimeMinutes: { type: integer }
            averageDailyMinutes: { type: number }
            studyMinutes: { type: integer }
            gamingMinutes: { type: integer }
            socialMediaMinutes: { type: integer }
            educationalMinutes: { type: integer }

    CreateConversationRequest:
      type: object
      required: [teacherId, studentId]
      properties:
        teacherId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }

    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConversationResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Conversation' }

    ConversationListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }

    SendMessageRequest:
