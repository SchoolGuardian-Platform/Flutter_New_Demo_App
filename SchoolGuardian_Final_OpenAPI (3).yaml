      tags: [Digital Wellbeing]
      summary: Submit digital wellbeing usage
      description: |
        Records usage statistics supplied by a supported client.
        This is a monitoring/reporting API; it does not itself provide
        operating-system-level app blocking.
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellbeingUsageRequest'
